version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "chore(github-actions)"

  # Docker (if used for containerized builds)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    labels:
      - "docker"
      - "dependencies"

  # NuGet (.NET for UnrealBuildTool)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    labels:
      - "nuget"
      - "dependencies"